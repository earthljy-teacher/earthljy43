<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>미래 교통수단 설계 연구소 | 수행평가 시뮬레이션</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
*{box-sizing:border-box;font-family:'a시네마','A시네마','a시네마L','A시네마L',sans-serif;font-weight:400 !important}
body{margin:0;background:linear-gradient(160deg,#0b1430 0%,#13285a 55%,#0d3b4f 100%);min-height:100vh;color:#1d2433}
header{position:sticky;top:0;z-index:50;background:rgba(8,16,40,.92);backdrop-filter:blur(6px);color:#fff;padding:10px 18px;display:flex;align-items:center;gap:14px;border-bottom:1px solid #2a4a8a}
header h1{font-size:20px;margin:0;color:#7fe3ff;letter-spacing:1px}
header .sub{font-size:13px;color:#b9c7e6}
.brand{margin-left:auto;display:flex;align-items:center;gap:8px;text-align:right}
.brand img{height:46px;width:46px;border-radius:8px;background:#fff}
.brand .mail{font-size:12px;color:#ffd36b}
.steps{display:flex;gap:6px;padding:10px 18px;flex-wrap:wrap;background:rgba(8,16,40,.6)}
.chip{padding:6px 12px;border-radius:20px;background:#22335f;color:#9fb0d8;font-size:13px}
.chip.on{background:#00b4d8;color:#fff}
.chip.done{background:#2e7d5b;color:#e6fff2}
main{max-width:1080px;margin:0 auto;padding:18px}
.card{background:#fff;border-radius:16px;padding:18px 20px;margin-bottom:16px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.card h2{margin:0 0 6px;font-size:20px;color:#0b5394}
.card h3{margin:0 0 8px;font-size:17px;color:#1565c0}
.mission{background:linear-gradient(120deg,#102a5c,#1b4f8a);color:#fff}
.mission h2{color:#7fe3ff}
.desc{font-size:14px;color:#4a5568;line-height:1.6}
.hl{color:#d9480f}.hb{color:#1971c2}.hg{color:#2b8a3e}.hp{color:#862e9c}
.grid{display:grid;gap:10px}
.g5{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.opt{border:2px solid #d0d8e8;border-radius:12px;padding:12px;cursor:pointer;background:#f8faff;transition:.15s}
.opt:hover{border-color:#74c0fc;transform:translateY(-2px)}
.opt.sel{border-color:#00b4d8;background:#e3f8ff;box-shadow:0 0 0 3px rgba(0,180,216,.25)}
.opt .ic{font-size:30px}
.opt .nm{font-size:15px;color:#0b3d91;margin:4px 0}
.opt .ds{font-size:12.5px;color:#55607a;line-height:1.5}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.ecard{padding:8px 12px;border-radius:10px;background:#fff4e6;border:2px solid #ffc078;cursor:pointer;font-size:14px}
.ecard:hover{background:#ffe8cc}
.chain{display:flex;align-items:center;flex-wrap:wrap;gap:6px;min-height:58px;padding:10px;border:2px dashed #91a7ff;border-radius:12px;background:#f3f6ff}
.slot{padding:8px 12px;border-radius:10px;background:#4dabf7;color:#fff;cursor:pointer;font-size:14px}
.arrow{color:#5c7cfa;font-size:20px}
.parts{display:flex;flex-wrap:wrap;gap:8px}
.part{padding:8px 12px;border-radius:20px;border:2px solid #ced4da;background:#f8f9fa;cursor:pointer;font-size:14px}
.part.on{background:#d3f9d8;border-color:#40c057;color:#2b8a3e}
.btn{border:none;border-radius:10px;padding:10px 18px;font-size:15px;cursor:pointer;background:#00b4d8;color:#fff;margin:4px 4px 4px 0}
.btn:hover{filter:brightness(1.1)}
.btn.sec{background:#e9ecef;color:#343a40}
.btn.warn{background:#f76707}
.btn.go{background:#2f9e44}
.btn:disabled{background:#adb5bd;cursor:not-allowed}
canvas{width:100%;border-radius:12px;background:#0b1b3a;display:block}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.sl{flex:1;min-width:230px}
.sl label{font-size:14px;color:#334}
.sl input[type=range]{width:100%}
.val{color:#d9480f}
textarea,input[type=text]{width:100%;border:2px solid #ced4da;border-radius:10px;padding:10px;font-size:15px;line-height:1.6}
textarea{min-height:110px;resize:vertical}
textarea:focus,input:focus{outline:none;border-color:#4dabf7}
.cnt{font-size:12px;color:#868e96;text-align:right}
.log{background:#0b1b3a;color:#c5f6fa;border-radius:10px;padding:10px 14px;font-size:14px;line-height:1.7;min-height:44px;margin-top:8px}
.log .bad{color:#ff8787}.log .good{color:#8ce99a}.log .warnc{color:#ffd43b}
.gauge{height:16px;border-radius:8px;background:#e9ecef;overflow:hidden}
.gauge>div{height:100%;background:#40c057;transition:.3s}
.chk{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border-radius:10px;border:1px solid #dee2e6;margin-bottom:6px;cursor:pointer;font-size:14px;background:#fcfdff}
.chk.on{background:#e7f5ff;border-color:#4dabf7}
.chk .box{width:20px;height:20px;border-radius:5px;border:2px solid #4dabf7;flex:none;text-align:center;line-height:16px;color:#fff;font-size:14px}
.chk.on .box{background:#4dabf7}
select{border:2px solid #ced4da;border-radius:8px;padding:7px;font-size:14px;max-width:100%}
.platform{position:relative;height:150px;border-radius:12px;background:linear-gradient(#cfe8ff 0 62%,#8d99ae 62% 70%,#495057 70%);overflow:hidden}
.bus{position:absolute;right:14px;bottom:40px;width:170px;height:70px;border-radius:14px;background:#12b886;box-shadow:inset 0 -8px 0 #087f5b}
.bus .door{position:absolute;left:18px;bottom:0;width:30px;height:52px;background:#c3fae8;border:2px solid #087f5b}
.bus .win{position:absolute;top:10px;width:30px;height:22px;background:#e3fafc;border-radius:4px}
.pax{position:absolute;bottom:42px;width:64px;text-align:center;transition:transform 1s ease,opacity .5s}
.pax .em{font-size:34px}
.pax .lb{font-size:11px;color:#212529;background:rgba(255,255,255,.8);border-radius:6px}
.pax .bb{position:absolute;bottom:72px;left:-30px;width:130px;font-size:11px;background:#fff;border-radius:8px;padding:4px;box-shadow:0 2px 6px rgba(0,0,0,.3);display:none}
.pax.fail .bb{display:block;color:#c92a2a}
.pax.ok{opacity:.15}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border:1px solid #dee2e6;padding:7px 8px;text-align:left;vertical-align:top}
th{background:#e7f5ff;color:#1864ab}
.ok{color:#2b8a3e}.no{color:#e03131}
.score-big{font-size:54px;color:#f76707;line-height:1}
.bar{height:22px;border-radius:11px;background:#e9ecef;overflow:hidden;margin:4px 0}
.bar>div{height:100%;background:linear-gradient(90deg,#4dabf7,#20c997);color:#fff;font-size:13px;padding-left:8px;line-height:22px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#212529;color:#fff;padding:12px 20px;border-radius:12px;font-size:15px;z-index:99;display:none;max-width:90%}
.banner{background:#fff3bf;border:2px solid #fab005;border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:14px;color:#5c3c00}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:120;display:none;align-items:center;justify-content:center;padding:16px}
.modal .inner{background:#fff;border-radius:14px;max-width:760px;width:100%;max-height:92vh;overflow:auto;padding:16px}
.modal img{width:100%;border:1px solid #dee2e6;border-radius:8px;-webkit-touch-callout:default}
.note-box{background:#f8f9fa;border-left:4px solid #4dabf7;padding:8px 12px;border-radius:6px;font-size:14px;line-height:1.6;white-space:pre-wrap}
.fb{line-height:1.8;font-size:14.5px;margin-bottom:10px}
.small{font-size:12.5px;color:#6c757d}
.hidden{display:none}
@media(max-width:640px){header h1{font-size:16px}.brand .mail{font-size:10px}.score-big{font-size:42px}}
</style>
</head>

 $('steps').innerHTML=names.map((n,i)=>`<span class="chip ${i===S.screen?'on':(S.visited[i]&&i<S.screen?'done':'')}">${n}</span>`).join('');
}

}
function navBtns(n){

 return `<div class="card" style="text-align:right">
  ${S.mode!=='retry'&&n>1?`<button class="btn sec" onclick="go(${n-1})">◀ 이전 단계</button>`:''}

function nextFrom(n){

}
function validate(n){
 if(n===1){const s=S.s1;if(!s.prop)return '추진 방식을 선택하세요.';if(s.chain.length<2)return '에너지 전환 사슬을 완성하세요.';if(!s.parts.length)return '부품을 장착하세요.';if(!s.brake)return '제동 방식을 선택하세요.';if(s.tests<1)return '주행 테스트를 1회 이상 실시하세요.';if(s.note.trim().length<10)return '설계 노트를 작성하세요.'}
 if(n===2){const s=S.s2;if(!s.src)return '주 에너지원을 선택하세요.';if(s.runs<1)return '24시간 운행 시뮬레이션을 1회 이상 실행하세요.';if(s.note.trim().length<10)return '설계 노트를 작성하세요.'}
 if(n===3){const s=S.s3;if(!s.feat.length)return '교통약자 이동 지원 장치를 하나 이상 선택하세요.';if(s.boardRuns<1)return '탑승 테스트를 1회 이상 실시하세요.';if(s.note.trim().length<10)return '사회적 영향 분석 노트를 작성하세요.'}
 if(n===4){const s=S.s4;if(!s.concept)return '설계 콘셉트를 선택하세요.';if(!s.title.trim())return '설계안 이름을 입력하세요.';if(s.diff.trim().length<10)return '기존 교통수단과의 차별점을 작성하세요.';if(s.scen.trim().length<10)return '운행 시나리오를 작성하세요.'}
 return '';
}

function reqPower(prop){const crr=prop==='maglev'?0:0.01;const v=40/3.6;return (VEH_MASS*9.8*(0.1+crr)*v+2.88*v*v*v)/1000}
function driveSim(PkW,prop,brake){
 const m=VEH_MASS,g=9.8,crr=prop==='maglev'?0:0.01,k=2.88,P=PkW*1000,Fmax=16000;
 let x=0,v=0,t=0,t50=null,minSlope=99,regen=0,frames=[],overrun=0,lastF=-1;
 const dt=0.05;
 while(x<900&&t<180){
  const grade=(x>=350&&x<650)?0.1:0;
  const target=grade?40/3.6:50/3.6;
  const resist=m*g*(crr+grade)+k*v*v;
  let a;
  if(x>=800){
   const remain=Math.max(900-x,0.5);a=-Math.min(3,v*v/(2*remain));
   if(brake==='regen'&&v<3)a=-0.35;
   const fr=m*(-a)*v*dt;
   if(brake==='regen'||brake==='both')regen+=fr*(v<3?0.1:0.6);
   if(v<0.3){if(brake==='regen')overrun=Math.max(6,x-900+6);break}
  }else{
   const F=v<target?Math.min(Fmax,P/Math.max(v,0.5)):Math.min(resist,P/Math.max(v,0.5));
   a=(F-resist)/m;
  }
  v=Math.max(0,v+a*dt);x+=v*dt;t+=dt;
  if(t50===null&&v>=50/3.6-0.05)t50=t;
  if(x>420&&x<650)minSlope=Math.min(minSlope,v);
  if(t-lastF>=0.1){frames.push({t,x,v});lastF=t}
  if(v<0.05&&x<800&&t>5)break;
 }
 if(brake==='regen')overrun=Math.max(6,x-900+6);
 frames.push({t,x:Math.min(x,905),v:0});
 return {frames,t50,minSlope:minSlope*3.6,regenKWh:regen/3.6e6,overrun};
}

function isH(src){return src==='greenh2'||src==='grayh2'}
function isG(src){return src==='renew'||src==='coal'}
function energyMass(c){return c.batt*6+c.solar*15+(isH(c.src)?c.h2*20+c.fc*2:0)}
function energySim(c,weather,regen){
 const wf=weather==='sunny'?1:0.25,dem=15*(regen?0.85:1);
 let soc=c.batt,h2=isH(c.src)?c.h2:0,minSoc=1e9,fail=null;const rows=[];
 for(let h=0;h<24;h++){
  const solar=(h>=6&&h<=18)?c.solar*0.2*Math.sin(Math.PI*(h-6)/12)*wf:0;
  const d=(h>=6&&h<=21)?dem:0;
  let ch=0;if(isG(c.src)){if(h===12&&c.mid)ch=100;if(h>=22||h<5)ch=60}
  let fc=0;if(isH(c.src)&&c.fc>0&&h2>0&&soc<c.batt*0.6){fc=Math.min(c.fc,h2*16,c.batt-soc+d);h2-=fc/16}
  soc=Math.min(c.batt,soc+solar+ch+fc)-d;
  if(h>=6&&h<=21){minSoc=Math.min(minSoc,soc);if(soc<c.batt*0.1&&fail===null)fail=h}
  rows.push({h,solar,d,soc,fc,ch});
 }
 const mass=energyMass(c);
 return {rows,minSoc,fail,h2left:h2,mass,ok:fail===null&&mass<=MASS_LIMIT,dem};
}

function drawChart(r,upto){

 g.strokeStyle='#3b5b8f';g.lineWidth=1;g.beginPath();g.moveTo(L,B);g.lineTo(L+W,B);g.moveTo(L,B);g.lineTo(L,B-H);g.stroke();
 g.fillStyle='#9fb3d9';g.font='12px sans-serif';for(let h=0;h<24;h+=3)g.fillText(h+'시',L+h*W/24+4,B+16);

 const cap=S.s2.batt,maxY=Math.max(cap,100);const n=upto||24;
 g.fillStyle='#9fb3d9';g.fillText(maxY+' kWh',4,B-H+4);
 for(let i=0;i<n;i++){const row=r.rows[i];const x=L+i*W/24;
  if(row.d>0){g.fillStyle='rgba(255,135,135,.55)';const hh=row.d/maxY*H;g.fillRect(x+4,B-hh,W/24-8,hh)}

  if(row.fc>0){g.fillStyle='rgba(151,117,250,.7)';const hh=row.fc/maxY*H;g.fillRect(x+12,B-hh,W/24-24,hh)}
 }
 g.strokeStyle='#ffd43b';g.lineWidth=2;g.beginPath();for(let i=0;i<n;i++){const x=L+i*W/24+W/48,y=B-r.rows[i].solar/maxY*H;i?g.lineTo(x,y):g.moveTo(x,y)}g.stroke();
 g.strokeStyle='#69db7c';g.lineWidth=3;g.beginPath();for(let i=0;i<n;i++){const x=L+i*W/24+W/48,y=B-Math.max(0,r.rows[i].soc)/maxY*H;i?g.lineTo(x,y):g.moveTo(x,y)}g.stroke();
 g.setLineDash([5,5]);g.strokeStyle='#ff6b6b';g.lineWidth=1;g.beginPath();g.moveTo(L,B-cap*0.1/maxY*H);g.lineTo(L+W,B-cap*0.1/maxY*H);g.stroke();g.setLineDash([]);
 g.font='12px sans-serif';const lg=[['#69db7c','저장 잔량'],['#ffd43b','태양광'],['#ff8787','소비'],['#74c0fc','충전'],['#b197fc','연료 전지']];
 lg.forEach((l,i)=>{g.fillStyle=l[0];g.fillText('■ '+l[1],L+W-400+i*82,B-H-10)});
}

}

function feasCheck(){
 const s=S.s4,p=S.s1.prop,m=energyMass(S.s2);const out=[];
 if(!s.concept)return out;
 const pn=p?` (현재: ${PROPS.find(x=>x.id===p).nm})`:'';
 if(s.concept==='module')out.push({ok:p==='ev'||p==='fcev',t:'모듈 셔틀은 도로 위를 달리며 연결·분리해야 하므로 전동기 구동(배터리 또는 연료 전지) 방식이 필요해요.'+pn});
 if(s.concept==='tube')out.push({ok:p==='maglev',t:'저진공 튜브 캡슐은 바퀴 마찰 없이 떠서 달리는 자기부상 추진이 필요해요.'+pn});
 if(s.concept==='evtol')out.push({ok:false,t:`약 8톤 셔틀과 에너지 장치(${m.toFixed(0)} kg)를 수직으로 띄우려면 엄청난 출력과 에너지가 필요해, 현재 배터리·수소 기술의 에너지 밀도로는 운행 시간을 확보할 수 없어요.`});
 if(s.concept==='wing')out.push({ok:false,t:'날개 장식은 양력·추진에 쓰이지 않아 운행 방식은 기존 버스와 같아요. 무게와 공기 저항만 늘어나요.'});
 if(s.concept==='anti')out.push({ok:false,t:'중력을 없애는 장치는 현재 알려진 물리 법칙으로 구현할 수 없어요.'});
 if(['jet','perp'].includes(p))out.push({ok:false,t:'1단계 추진 방식 자체가 과학적·환경적으로 타당하지 않아요.'});
 out.push({ok:m<=MASS_LIMIT,t:`에너지 장치 질량 ${m.toFixed(0)} kg (기준 ${MASS_LIMIT} kg 이하)`});
 return out;
}

 ][i];
 const good=r.map((e,k)=>e.ok?GOOD[i][k]:'').filter(Boolean).join(' ');
 const bad=r.map((e,k)=>e.ok?'':`<span class="hl">[${EL_NAMES[i][k]}]</span> ${e.why}`).filter(Boolean).join(' ');
 return proc+' '+good+' '+(bad?'다만 '+bad:'<span class="hg">이 단계의 모든 요소를 충족했어요!</span>');
}
function renderResult(){
 const sc=score();const S1=S.s1,S2=S.s2,S3=S.s3,S4=S.s4;
 const nm=(arr,id)=>(arr.find(x=>x.id===id)||{nm:'미선택'}).nm;
 const weak=sc.st.map((v,i)=>({v,i})).filter(x=>x.v<5);
 const msg=sc.total===20?'모든 평가 요소를 충족한 완벽한 설계예요!':sc.total>=15?'훌륭한 설계예요. 부족한 요소만 보완하면 완성도가 더 높아져요.':sc.total>=10?'기본 설계는 갖췄어요. 과학적 근거와 현실적 제약을 더 꼼꼼히 따져 보세요.':'설계의 과학적 근거가 부족해요. 아래 피드백을 바탕으로 보완해 보세요.';
 $('app').innerHTML=`
 <div id="report" style="background:#fff;border-radius:16px;padding:20px;margin-bottom:16px">
  <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;border-bottom:2px solid #e7f5ff;padding-bottom:10px">
   <div><div style="font-size:24px;color:#0b5394">🏁 미션 성공 · 미래 교통수단 설계 보고서</div>
    <div class="small">학번 ${esc(S.sid)} · 이름 ${esc(S.name)} · ${new Date().toLocaleString('ko-KR')}</div></div>
   <div style="display:flex;align-items:center;gap:8px"><div style="text-align:right"><div style="color:#1971c2;font-size:13px">EARTH LJY</div><div style="color:#e67700;font-size:12px">${$('brandMail').textContent}</div></div><img src="${document.querySelector('.brand img').src}" style="height:48px;width:48px"></div>
  </div>
  <div class="row" style="margin:14px 0;align-items:flex-end">
   <div><div class="small">최종 점수(단계별 요소 점수의 합)</div><div class="score-big">${sc.total}<span style="font-size:22px;color:#868e96"> / 20점</span></div></div>
   <div style="flex:1;min-width:240px">${sc.st.map((v,i)=>`<div class="small">${i+1}단계 ${STAGE_NAMES[i]} ${v}/5점${S.retryUsed[i+1]?' <span class="hp">(보완 재도전 반영)</span>':''}</div><div class="bar"><div style="width:${v*20}%">${v?v+'점':''}</div></div>`).join('')}</div>
  </div>
  <p style="color:#1971c2;font-size:16px">💬 ${msg}</p>
  <h3 style="color:#1565c0">📊 평가 요소별 충족 결과</h3>
  <table><tr><th>단계</th><th>평가 요소</th><th style="width:90px">결과</th><th style="width:50px">점수</th></tr>
  ${sc.R.map((r,i)=>r.map((e,k)=>`<tr>${k===0?`<td rowspan="5">${i+1}. ${STAGE_NAMES[i]}<br><span class="hl">${sc.st[i]}/5점</span></td>`:''}<td>${EL_NAMES[i][k]}</td><td class="${e.ok?'ok':'no'}">${e.ok?'충족 ⭕':'미충족 ❌'}</td><td>${e.ok?1:0}</td></tr>`).join('')).join('')}
  <tr><td colspan="3" style="text-align:right;color:#1864ab">합계</td><td class="hl">${sc.total}</td></tr>
  </table>
  <h3 style="color:#1565c0;margin-top:16px">🧑‍🔬 나의 설계 내용</h3>
  <table>
   <tr><th style="width:130px">동력 장치</th><td>${nm(PROPS,S1.prop)} · 출력 ${S1.power} kW · 제동: ${({friction:'마찰 브레이크만',regen:'회생 제동만',both:'회생 제동 + 마찰 브레이크'})[S1.brake]||'미선택'}<br>에너지 전환: ${S1.chain.map(c=>ECARDS.find(e=>e.id===c).t).join(' ➜ ')||'-'}<br>부품: ${S1.parts.map(p=>PARTS.find(x=>x.id===p).t).join(', ')||'-'}</td></tr>
   <tr><th>에너지 운용</th><td>${nm(SRCS,S2.src)} · 태양광 ${S2.solar} m² · 배터리 ${S2.batt} kWh${isH(S2.src)?` · 수소 ${S2.h2} kg · 연료 전지 ${S2.fc} kW`:''}${isG(S2.src)?` · 정류장 급속 충전 ${S2.mid?'운영':'미운영'}`:''} · 장치 질량 ${energyMass(S2).toFixed(0)} kg</td></tr>
   <tr><th>교통약자·환경</th><td>${S3.feat.map(f=>FEATS.find(x=>x.id===f).t).join(' / ')||'-'}<br>환경 개선: ${ENVS.filter(e=>S3.env[e.id]).map(e=>e.nm).join(', ')||'-'}<br>부작용 분석: ${S3.side.map(id=>SIDES.find(d=>d.id===id).t).join(' / ')||'-'}</td></tr>
   <tr><th>설계안</th><td><span class="hb">${esc(S4.title)||'-'}</span> (${nm(CONCEPTS,S4.concept)})</td></tr>
  </table>
  <h3 style="color:#1565c0;margin-top:16px">✍️ 내가 작성한 내용</h3>
  <div class="small">① 작동 원리 설명</div><div class="note-box">${esc(S1.note)||'-'}</div>
  <div class="small" style="margin-top:6px">② 에너지 운용 설명</div><div class="note-box">${esc(S2.note)||'-'}</div>
  <div class="small" style="margin-top:6px">③ 사회적 영향 분석</div><div class="note-box">${esc(S3.note)||'-'}</div>
  <div class="small" style="margin-top:6px">④ 기존 교통수단과의 차별점</div><div class="note-box">${esc(S4.diff)||'-'}</div>
  <div class="small" style="margin-top:6px">④ 운행 시나리오</div><div class="note-box">${esc(S4.scen)||'-'}</div>
  <h3 style="color:#1565c0;margin-top:16px">📝 과제 수행 과정 피드백</h3>
  ${sc.R.map((r,i)=>`<div class="fb"><span class="hb">${i+1}단계 ${STAGE_NAMES[i]} (${sc.st[i]}/5점)</span><br>${stageFeedback(i,sc.R)}</div>`).join('')}
  ${weak.length?`<div class="banner" style="margin-top:6px">🔧 점수를 올리려면: ${weak.map(w=>`<span class="hl">${w.i+1}단계(${STAGE_NAMES[w.i]})</span>`).join(', ')}의 미충족 요소만 보완하면 돼요. ${weak.some(w=>S.retries[w.i+1]>0)?'아래 버튼으로 해당 단계만 다시 수행할 수 있어요.':'보완 재도전 기회를 모두 사용했어요.'}</div>`:''}
 </div>
 <div class="card" data-html2canvas-ignore="true">
  <h3>🔁 부족한 단계만 보완 재도전</h3>
  ${weak.length?weak.map(w=>`<button class="btn ${S.retries[w.i+1]>0?'warn':''}" ${S.retries[w.i+1]>0?'':'disabled'} onclick="startRetry(${w.i+1})">${w.i+1}단계 ${STAGE_NAMES[w.i]} 다시 수행 (남은 기회 ${S.retries[w.i+1]}회)</button>`).join(''):'<p class="desc hg">모든 단계를 만점으로 완료했어요. 보완할 단계가 없어요!</p>'}
  <p class="small">※ 만점(5점)인 단계는 재도전할 수 없어요. 재도전한 단계의 새 결과가 최종 점수에 반영돼요.</p>
  <hr style="border:none;border-top:1px solid #dee2e6">
  <button class="btn go" onclick="makeImage()">📷 결과 이미지 만들기</button>
 </div>`;
}
function startRetry(n){
 if(S.retries[n]<=0)return;S.retries[n]--;S.retryUsed[n]=1;S.mode='retry';
 if(n===1){S.s1.tests=0;S.s1.testLimit=2}
 if(n===2){S.s2.runs=0;S.s2.runLimit=3}
 if(n===4){S.s4.checks=0;S.s4.checkLimit=1}
 go(n);
}

/* ================= 이미지 저장 (아이패드 대응) ================= */
const IS_IOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
let imgBlob=null,imgURL=null;
async function makeImage(){
 if(typeof html2canvas==='undefined'){toast('이미지 도구를 불러오지 못했어요. 인터넷 연결을 확인하세요.');return}
 const el=$('report');toast('이미지를 만드는 중이에요…',6000);
 try{
  const w=el.scrollWidth,h=el.scrollHeight;
  let scale=2;
  if(IS_IOS){scale=Math.min(2,Math.sqrt(16000000/(w*h)),8000/h,8000/w);scale=Math.max(scale,0.4)}
  const canvas=await html2canvas(el,{scale,backgroundColor:'#ffffff',useCORS:true});
  const url=canvas.toDataURL('image/png');
  if(!url||url.length<5000)throw new Error('empty');
  imgURL=url;imgBlob=await new Promise(r=>canvas.toBlob(r,'image/png'));
  $('preview').src=url;
  $('saveGuide').innerHTML=IS_IOS?'아이패드·아이폰: <span class="hb">[이미지 저장하기]</span>를 누르면 공유 창이 열려요. <span class="hb">이미지 저장</span> 또는 <span class="hb">파일에 저장</span>을 고르세요. 버튼이 작동하지 않으면 아래 이미지를 <span class="hl">길게 눌러 [사진 앱에 저장]</span>하세요.':'PC·안드로이드: <span class="hb">[이미지 저장하기]</span>를 누르면 파일로 내려받아요.';
  $('modal').style.display='flex';$('toast').style.display='none';
 }catch(e){toast('이미지를 만들지 못했어요. 잠시 후 다시 시도하세요.')}
}
async function saveImage(){
 const fname=`미래교통수단_${S.sid}_${S.name}.png`;
 if(IS_IOS){
  try{const file=new File([imgBlob],fname,{type:'image/png'});
   if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'미래 교통수단 설계 결과'});return}
  }catch(e){if(e&&e.name==='AbortError')return}
  toast('이 환경에서는 공유 창을 열 수 없어요. 미리보기 이미지를 길게 눌러 [사진 앱에 저장]하세요.',5000);return;
 }
 const a=document.createElement('a');const u=imgBlob?URL.createObjectURL(imgBlob):imgURL;a.href=u;a.download=fname;document.body.appendChild(a);a.click();
 setTimeout(()=>{a.remove();if(imgBlob)URL.revokeObjectURL(u)},1000);
}
function closeModal(){$('modal').style.display='none'}

go(0);
</script>
